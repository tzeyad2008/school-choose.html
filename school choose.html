<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اكتشف مدرستي ومرافقها</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Lalezar&display=swap');

    :root {
        --primary: #6d28d9;
        --secondary: #ec4899;
        --accent: #f59e0b;
        --success: #10b981;
        --text-dark: #1e1b4b;
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.9);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .blob {
        position: fixed; border-radius: 50%; filter: blur(60px);
        z-index: 0; opacity: 0.6; animation: float 10s infinite alternate;
    }
    .blob-1 { width: 300px; height: 300px; background: #ff9a9e; top: -50px; right: -50px; }
    .blob-2 { width: 400px; height: 400px; background: #a1c4fd; bottom: -100px; left: -100px; animation-delay: -5s; }
    .blob-3 { width: 250px; height: 250px; background: #fbc2eb; top: 40%; left: 20%; animation-delay: -2s; }

    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 50px) scale(1.1); }
    }

    #toastContainer {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 3000; display: flex; flex-direction: column; align-items: center;
        gap: 10px; pointer-events: none;
    }

    .toast {
        background: var(--glass-bg); backdrop-filter: blur(10px);
        border: 2px solid var(--glass-border);
        padding: 15px 30px; border-radius: 50px;
        font-weight: 900; font-size: 1.1rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        display: flex; align-items: center; gap: 10px; color: var(--text-dark);
    }
    .toast.success { border-color: var(--success); color: #047857; }
    .toast.error { border-color: var(--primary); color: var(--primary); }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-30px) scale(0.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

    header {
        width: 100%; max-width: 1200px; padding: 15px;
        display: flex; flex-direction: column; align-items: center; z-index: 10;
    }

    h1 {
        font-family: 'Lalezar', cursive; font-size: 3rem;
        background: linear-gradient(to right, var(--primary), var(--secondary));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0px 3px 2px rgba(255,255,255,0.8));
        margin-bottom: 10px; text-align: center;
    }

    .hud-panel {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; background: var(--glass-bg); backdrop-filter: blur(16px);
        border: 2px solid var(--glass-border); padding: 12px 20px;
        border-radius: 20px; box-shadow: var(--glass-shadow);
        margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
    }

    .stat-box {
        display: flex; align-items: center; gap: 8px;
        background: rgba(255, 255, 255, 0.9); padding: 5px 12px;
        border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }
    .stat-icon { font-size: 1.4rem; }
    .stat-info { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.75rem; color: #64748b; font-weight: 700; }
    .stat-value { font-family: 'Lalezar', cursive; font-size: 1.5rem; color: var(--primary); line-height: 1; }

    .progress-container {
        flex-grow: 1; min-width: 150px; max-width: 350px;
        background: rgba(255, 255, 255, 0.9); height: 22px;
        border-radius: 20px; padding: 3px;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        position: relative; overflow: hidden; border: 1px solid #e2e8f0;
    }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--success), #34d399);
        border-radius: 15px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .progress-text {
        position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
        font-size: 0.8rem; font-weight: 900; color: var(--text-dark); z-index: 2;
    }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
        font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 0.95rem;
        border: none; border-radius: 12px; padding: 10px 18px;
        cursor: pointer; transition: var(--transition-bounce);
        display: flex; align-items: center; gap: 5px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; color: var(--text-dark);
    }
    button:active { transform: scale(0.95); }
    .btn-sound { color: var(--secondary); font-size: 1.2rem; padding: 8px 14px; }
    .btn-level { background: var(--accent); color: white; }

    .game-area {
        width: 100%; max-width: 1200px;
        display: flex; flex-direction: column; gap: 25px;
        padding: 10px; z-index: 10;
    }

    .section-title {
        font-family: 'Lalezar', cursive; font-size: 1.8rem; color: var(--primary);
        margin-bottom: 12px; text-align: center;
        background: rgba(255,255,255,0.85); padding: 6px 20px;
        border-radius: 20px; display: inline-block; align-self: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .grid-container { display: grid; gap: 20px; justify-content: center; width: 100%; }

    #wordsGrid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    #imagesGrid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    @media (max-width: 800px) {
        h1 { font-size: 2.2rem; }
        #wordsGrid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        #imagesGrid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (max-width: 500px) {
        h1 { font-size: 1.8rem; }
        #wordsGrid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        #imagesGrid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card-word { font-size: 1.4rem !important; padding: 20px 10px !important; }
        .section-title { font-size: 1.4rem; }
    }

    .card {
        background: white; border-radius: 20px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        cursor: pointer; transition: var(--transition-bounce);
        box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        border: 4px solid transparent;
        position: relative; overflow: hidden; user-select: none;
    }

    .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

    .card-word {
        font-family: 'Lalezar', cursive; font-size: 1.9rem;
        padding: 35px 15px; color: var(--text-dark);
        background: linear-gradient(135deg, #ffffff, #f8fafc);
        min-height: 120px;
    }

    .card-word.selected {
        border-color: var(--secondary);
        background: #fff0f6;
        transform: scale(1.05);
        box-shadow: 0 0 0 6px rgba(236, 72, 153, 0.3);
    }

    .card-image {
        aspect-ratio: 1/1;
        background: linear-gradient(135deg, #e0f2fe, #fef3c7);
        padding: 0;
    }

    .illustration {
        width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
    }
    .illustration svg { width: 100%; height: 100%; display: block; }

    .card.matched {
        border-color: var(--success);
        pointer-events: none;
        animation: pulseSuccess 0.6s ease;
    }
    .card.matched .illustration { opacity: 0.5; }
    .card.matched::after {
        content: '✓';
        position: absolute; top: 12px; right: 12px;
        background: var(--success); color: white;
        width: 40px; height: 40px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; font-size: 1.4rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
    }
    .card-word.matched { background: #ecfdf5; color: #047857; }

    .card.wrong { animation: shake 0.5s ease; border-color: #ef4444; }

    @keyframes pulseSuccess { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    .mascot-wrapper {
        position: fixed; bottom: 20px; right: 20px;
        width: 110px; height: 110px; z-index: 100;
        transition: var(--transition-bounce);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
    }
    .mascot-svg { width: 100%; height: 100%; animation: floatMascot 3s ease-in-out infinite; }
    .mascot-wrapper.happy { animation: jumpMascot 0.6s ease; }
    @keyframes floatMascot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes jumpMascot { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.1) rotate(10deg); } }

    .overlay {
        position: fixed; inset: 0;
        background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
        display: flex; justify-content: center; align-items: center;
        z-index: 2000; opacity: 0; pointer-events: none;
        transition: opacity 0.4s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-card {
        background: #ffffff; padding: 35px; border-radius: 30px;
        text-align: center; max-width: 90%; width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), inset 0 0 0 6px #f1f5f9;
        transform: scale(0.5) translateY(50px);
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .overlay.show .overlay-card { transform: scale(1) translateY(0); }
    .overlay-icon { font-size: 5rem; margin-bottom: 10px; animation: floatMascot 2s infinite; }
    .overlay-title { font-family: 'Lalezar', cursive; font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
    .overlay-desc { font-size: 1.1rem; color: #64748b; margin-bottom: 20px; font-weight: 700; }
    .overlay-actions { display: flex; flex-direction: column; gap: 10px; }
    .overlay-actions button { width: 100%; justify-content: center; padding: 14px; font-size: 1.15rem; border-radius: 15px; }
    .btn-replay { background: var(--success); color: white; }
    .btn-levels { background: var(--accent); color: white; }

    .particle {
        position: fixed; pointer-events: none; font-size: 1.5rem;
        z-index: 1500; animation: popOut 0.8s ease-out forwards;
    }
    @keyframes popOut {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(360deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="toastContainer"></div>

    <div class="mascot-wrapper" id="mascot">
        <svg class="mascot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
            <ellipse cx="50" cy="65" rx="25" ry="20" fill="#fef3c7"/>
            <g id="mascotEyesNormal">
                <circle cx="30" cy="40" r="15" fill="white" stroke="#d97706" stroke-width="3"/>

                <circle cx="30" cy="40" r="6" fill="#1e293b"/>
                <circle cx="70" cy="40" r="6" fill="#1e293b"/>
                <circle cx="28" cy="38" r="2" fill="white"/>
                <circle cx="68" cy="38" r="2" fill="white"/>
                <path d="M50 50 L40 65 L60 65 Z" fill="#ea580c" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <g id="mascotEyesHappy" style="display:none;">
                <circle cx="30" cy="40" r="15" fill="white" stroke="#d97706" stroke-width="3"/>
                <circle cx="70" cy="40" r="15" fill="white" stroke="#d97706" stroke-width="3"/>
                <path d="M22 40 Q30 30 38 40" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
                <path d="M62 40 Q70 30 78 40" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
                <path d="M40 60 Q50 75 60 60" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
            </g>
            <path d="M10 60 Q5 80 20 85" fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
            <path d="M90 60 Q95 80 80 85" fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
            <path d="M40 90 L30 100 M60 90 L70 100" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
        </svg>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="overlay-icon">👑</div>
            <h2 class="overlay-title">أحسنت يا بطل!</h2>
            <p class="overlay-desc" id="overlayDesc">لقد تعرفت على مرافق مدرستك!</p>
            <div class="overlay-actions">
                <button class="btn-replay" onclick="restartGame()">العب مرة أخرى 🔄</button>
                <button class="btn-levels" onclick="cycleLevel()">اختر مستوى آخر 🎯</button>
            </div>
        </div>
    </div>

    <header>
        <h1>اكتشف مدرستي ومرافقها</h1>
        <div class="hud-panel">
            <div class="stat-box">
                <span class="stat-icon">🎯</span>
                <div class="stat-info">
                    <span class="stat-label">المستوى</span>
                    <span class="stat-value" id="levelDisplay">1</span>
                </div>
            </div>
            <div class="stat-box">
                <span class="stat-icon">⭐</span>
                <div class="stat-info">
                    <span class="stat-label">الإجابات الصحيحة</span>
                    <span class="stat-value" id="scoreDisplay">0</span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>
            <div class="controls">
                <button class="btn-level" onclick="cycleLevel()">تغيير المستوى 🔄</button>
                <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
            </div>
        </div>
    </header>

    <main class="game-area">
        <div>
            <div class="section-title">1. اختر الكلمة</div>
            <div class="grid-container" id="wordsGrid"></div>
        </div>
        <div>
            <div class="section-title">2. اضغط على الصورة المناسبة</div>
            <div class="grid-container" id="imagesGrid"></div>
        </div>
    </main>

// 3. المكتبة - رفوف كتب وكتاب مفتوح
const svgLibrary = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

/* =========================================
   بيانات المدرسة
   ========================================= */
const schoolData = [
    { id: 1, word: 'المدرسة', desc: 'مبنى المدرسة', svg: svgSchool },
    { id: 2, word: 'الفصل', desc: 'الفصل الدراسي', svg: svgClassroom },
    { id: 3, word: 'المكتبة', desc: 'المكتبة المدرسية', svg: svgLibrary },
    { id: 4, word: 'المعمل', desc: 'معمل العلوم', svg: svgLab },
    { id: 5, word: 'غرفة الحاسب الآلي', desc: 'غرفة الكمبيوتر', svg: svgComputer },
    { id: 6, word: 'فناء المدرسة', desc: 'فناء المدرسة', svg: svgCourtyard },
    { id: 7, word: 'الملعب', desc: 'الملعب الرياضي', svg: svgPlayground },
    { id: 8, word: 'غرفة المدير', desc: 'غرفة المدير', svg: svgOffice },
    { id: 9, word: 'دورة المياه', desc: 'دورة المياه', svg: svgBathroom },
    { id: 10, word: 'المقصف المدرسي', desc: 'المقصف المدرسي', svg: svgCafeteria }
];

const levels = [
    { id: 1, count: 3, label: 'سهل' },
    { id: 2, count: 5, label: 'متوسط' },
    { id: 3, count: 10, label: 'متقدم' }
];

let currentLevelIndex = 0;
let soundEnabled = true;
let audioCtx = null;
let currentData = [];
let selectedWordId = null;
let score = 0;
let totalItems = 0;

const wordsGrid = document.getElementById('wordsGrid');
const imagesGrid = document.getElementById('imagesGrid');
const scoreDisplay = document.getElementById('scoreDisplay');
const levelDisplay = document.getElementById('levelDisplay');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const overlay = document.getElementById('overlay');
const overlayDesc = document.getElementById('overlayDesc');
const toastContainer = document.getElementById('toastContainer');
const mascot = document.getElementById('mascot');
const mascotEyesNormal = document.getElementById('mascotEyesNormal');
const mascotEyesHappy = document.getElementById('mascotEyesHappy');

const successMessages = [
    "برافو عليك يا بطل! 🌟",
    "أحسنت! دي الصورة الصحيحة! 🎉",
    "ممتاز! أنت شاطر! 👏",
    "رائع! لقد عرفت المكان الصحيح! 🥳"
];

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol=0.1) {
    if (!soundEnabled) return;
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playClapSound() {
    if (!soundEnabled) return;
    initAudio();
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    filter.Q.value = 1;
    const gainNode = audioCtx.createGain();
    const now = audioCtx.currentTime;
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(1, now + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    gainNode.gain.setValueAtTime(0, now + 0.15);
    gainNode.gain.linearRampToValueAtTime(0.8, now + 0.17);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
    noiseNode.start();
}

function playSound(type) {
    if (!soundEnabled) return;
    if (type === 'success') {
        playClapSound();
        setTimeout(() => playTone(659.25, 'sine', 0.1, 0.05), 100);
        setTimeout(() => playTone(783.99, 'sine', 0.2, 0.05), 200);
    } else if (type === 'error') {
        playTone(250, 'sine', 0.3, 0.05);
    } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.3, 0.05), i * 150));
    } else if (type === 'click') {
        playTone(600, 'sine', 0.05, 0.02);
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
    if(soundEnabled) playSound('click');
}

function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icon = type === 'success' ? '🌟' : '💪';
    toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
    toastContainer.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initializeGame() {
    const level = levels[currentLevelIndex];
    currentData = shuffle([...schoolData]).slice(0, level.count);
    selectedWordId = null;
    score = 0;
    totalItems = currentData.length;
    overlay.classList.remove('show');
    levelDisplay.innerText = level.id;
    updateProgress();
    mascotEyesNormal.style.display = 'block';
    mascotEyesHappy.style.display = 'none';
    mascot.classList.remove('happy');
    renderWords();
    renderImages();
}

function renderWords() {
    wordsGrid.innerHTML = '';
    const shuffledWords = shuffle([...currentData]);
    shuffledWords.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card card-word';
        card.innerText = item.word;
        card.dataset.id = item.id;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `اختر كلمة ${item.word}`);
        card.addEventListener('click', () => selectWord(item.id, card));
        card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectWord(item.id, card); }
        });
        wordsGrid.appendChild(card);
    });
}

function renderImages() {
    imagesGrid.innerHTML = '';
    const shuffledImages = shuffle([...currentData]);
    shuffledImages.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card card-image';
        card.dataset.id = item.id;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `صورة ${item.desc}`);
        card.innerHTML = `<div class="illustration">${item.svg}</div>`;
        card.addEventListener('click', () => handleImageClick(item.id, card));
        card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleImageClick(item.id, card); }
        });
        imagesGrid.appendChild(card);
    });
}

function selectWord(id, cardElement) {
    document.querySelectorAll('.card-word').forEach(c => c.classList.remove('selected'));
    cardElement.classList.add('selected');
    selectedWordId = id;
    playSound('click');
    showToast('تمام! دلوقتي اضغط على الصورة المناسبة', 'success');
}

function handleImageClick(imageId, cardElement) {
    if (selectedWordId === null) {
        showToast('اختار كلمة الأول يا بطل! 👆', 'error');
        playSound('error');
        return;
    }
    if (imageId === selectedWordId) {
        handleCorrectAnswer(imageId, cardElement);
    } else {
        handleWrongAnswer(cardElement);
    }
}

function handleCorrectAnswer(imageId, imageElement) {
    score++;
    updateProgress();
    imageElement.classList.add('matched');
    const selectedWordElement = document.querySelector(`.card-word[data-id="${imageId}"]`);
    if (selectedWordElement) {
        selectedWordElement.classList.add('matched');
        selectedWordElement.classList.remove('selected');
    }
    playSound('success');
    showToast(successMessages[Math.floor(Math.random() * successMessages.length)], 'success');
    mascotEyesNormal.style.display = 'none';
    mascotEyesHappy.style.display = 'block';
    mascot.classList.add('happy');
    setTimeout(() => {
        mascotEyesNormal.style.display = 'block';
        mascotEyesHappy.style.display = 'none';
        mascot.classList.remove('happy');
    }, 1500);
    const rect = imageElement.getBoundingClientRect();
    createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    selectedWordId = null;
    if (score === totalItems) setTimeout(finishGame, 1000);
}

function handleWrongAnswer(imageElement) {
    showToast('حاول تاني، أنت تقدر! 💪', 'error');
    playSound('error');
    imageElement.classList.add('wrong');
    setTimeout(() => imageElement.classList.remove('wrong'), 500);
}

function updateProgress() {
    scoreDisplay.innerText = score;
    progressText.innerText = `${score} / ${totalItems}`;
    const percent = totalItems === 0 ? 0 : (score / totalItems) * 100;
    progressFill.style.width = `${percent}%`;
}

function finishGame() {
    playSound('win');
    overlayDesc.innerHTML = `لقد تعرفت على مرافق مدرستك!<br><br>الإجابات الصحيحة: <strong>${score}</strong> من <strong>${totalItems}</strong>`;
    overlay.classList.add('show');
}

function restartGame() { initializeGame(); }
function cycleLevel() {
    currentLevelIndex = (currentLevelIndex + 1) % levels.length;
    initializeGame();
}

function createParticles(x, y) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const emojis = ['🌟', '✨', '🎉', '⭐', '💫'];
    for (let i = 0; i < 10; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        const dx = (Math.random() - 0.5) * 200;
        const dy = (Math.random() - 0.5) * 200;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--dy', `${dy}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }
}

window.onload = () => { initializeGame(); };
</script>
