<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اختر واسحب وتعلم - مدرستي ومرافقها</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Lalezar&display=swap');

    :root {
        --primary: #7c3aed;
        --primary-light: #a78bfa;
        --secondary: #ec4899;
        --accent: #f59e0b;
        --success: #10b981;
        --success-light: #34d399;
        --danger: #ef4444;
        --text-dark: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.95);
        --glass-shadow: 0 12px 40px rgba(31, 38, 135, 0.2);
        --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(-45deg, #ff9a9e, #fbc2eb, #a1c4fd, #c2e9fb, #fbc2eb);
        background-size: 400% 400%;
        animation: gradientBG 18s ease infinite;
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        position: relative;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .blob {
        position: fixed; border-radius: 50%; filter: blur(70px);
        z-index: 0; opacity: 0.55; animation: floatBlob 12s infinite alternate;
    }
    .blob-1 { width: 350px; height: 350px; background: #ff9a9e; top: -80px; right: -80px; }
    .blob-2 { width: 450px; height: 450px; background: #a1c4fd; bottom: -150px; left: -150px; animation-delay: -6s; }
    .blob-3 { width: 300px; height: 300px; background: #fbc2eb; top: 40%; left: 15%; animation-delay: -3s; }

    @keyframes floatBlob {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(50px, 70px) scale(1.15); }
    }

    .stars-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: 
            radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,0.8), transparent),
            radial-gradient(2px 2px at 85% 15%, rgba(255,255,255,0.8), transparent),
            radial-gradient(3px 3px at 45% 65%, rgba(255,255,255,0.6), transparent),
            radial-gradient(2px 2px at 75% 85%, rgba(255,255,255,0.7), transparent),
            radial-gradient(2px 2px at 25% 80%, rgba(255,255,255,0.6), transparent),
            radial-gradient(2px 2px at 60% 35%, rgba(255,255,255,0.5), transparent);
        animation: twinkleStars 4s ease-in-out infinite;
    }
    @keyframes twinkleStars {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
    }

    #toastContainer {
        position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
        z-index: 3000; display: flex; flex-direction: column; align-items: center;
        gap: 12px; pointer-events: none;
    }

    .toast {
        background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
        border: 3px solid;
        padding: 18px 40px; border-radius: 60px;
        font-weight: 900; font-size: 1.35rem;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        display: flex; align-items: center; gap: 12px;
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--primary); color: var(--primary); }
    .toast.streak { border-color: var(--accent); color: #b45309; background: linear-gradient(135deg, #fef3c7, #fde68a); }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-40px) scale(0.7); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-30px); } }

    header {
        width: 100%; max-width: 1300px; padding: 20px;
        display: flex; flex-direction: column; align-items: center; z-index: 10;
    }

    h1 {
        font-family: 'Lalezar', cursive; font-size: 3.5rem;
        background: linear-gradient(135deg, #7c3aed 0%, #ec4899 50%, #f59e0b 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0px 5px 4px rgba(255,255,255,0.9));
        margin-bottom: 15px; text-align: center;
        letter-spacing: 2px;
    }

    .hud-panel {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px);
        border: 3px solid var(--glass-border); padding: 15px 25px;
        border-radius: 25px; box-shadow: var(--glass-shadow);
        margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
    }

    .stat-box {
        display: flex; align-items: center; gap: 10px;
        background: rgba(255, 255, 255, 0.95); padding: 8px 18px;
        border-radius: 18px; box-shadow: 0 5px 12px rgba(0,0,0,0.08);
        border: 2px solid rgba(124, 58, 237, 0.15);
        transition: transform 0.3s ease;
    }
    .stat-box.pulse { animation: statPulse 0.5s ease; }
    @keyframes statPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }
    .stat-icon { font-size: 1.7rem; }
    .stat-info { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.85rem; color: #64748b; font-weight: 700; }
    .stat-value { font-family: 'Lalezar', cursive; font-size: 1.7rem; color: var(--primary); line-height: 1; }
    .stat-value.streak-fire { color: #dc2626; animation: fireGlow 0.5s ease; }
    @keyframes fireGlow {
        0%, 100% { text-shadow: 0 0 5px #dc2626; }
        50% { text-shadow: 0 0 20px #f97316, 0 0 30px #fbbf24; }
    }

    .progress-container {
        flex-grow: 1; min-width: 200px; max-width: 400px;
        background: rgba(255, 255, 255, 0.95); height: 26px;
        border-radius: 20px; padding: 4px;
        box-shadow: inset 0 3px 6px rgba(0,0,0,0.12);
        position: relative; overflow: hidden; border: 2px solid #e2e8f0;
    }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--success), var(--success-light), #6ee7b7);
        border-radius: 15px; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }
    .progress-text {
        position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
        font-size: 0.9rem; font-weight: 900; color: var(--text-dark); z-index: 2;
    }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
        font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 1rem;
        border: none; border-radius: 15px; padding: 10px 20px;
        cursor: pointer; transition: var(--transition-bounce);
        display: flex; align-items: center; gap: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15); background: white; color: var(--text-dark);
    }
    button:active { transform: scale(0.95); }
    .btn-sound { color: var(--secondary); font-size: 1.3rem; padding: 10px 15px; }
    .btn-level { background: linear-gradient(135deg, var(--accent), #fbbf24); color: white; }
    .btn-hint { 
        background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: white; 
        font-size: 0.95rem; position: relative;
    }
    .btn-hint:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-hint .hint-count {
        background: white; color: #8b5cf6; border-radius: 50%;
        width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
        font-size: 0.8rem; font-weight: 900;
    }
    .btn-voice { 
        background: linear-gradient(135deg, #06b6d4, #22d3ee); color: white;
        font-size: 1.2rem; padding: 10px 15px;
    }
    .btn-next { 
        background: linear-gradient(135deg, var(--success), var(--success-light)); 
        color: white; font-size: 1.2rem; padding: 15px 40px;
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }
    .btn-next:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .btn-next:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5); }

    .game-container {
        width: 100%; max-width: 1300px;
        display: flex; flex-direction: column; gap: 25px;
        padding: 15px; z-index: 10;
    }

    .question-card {
        background: var(--glass-bg); backdrop-filter: blur(20px);
        border: 3px solid var(--glass-border); border-radius: 30px;
        padding: 30px; box-shadow: var(--glass-shadow);
        display: flex; flex-direction: column; gap: 20px;
        align-items: center; text-align: center;
        position: relative; overflow: hidden;
    }
    .question-card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    .question-header {
        display: flex; justify-content: space-between; width: 100%;
        align-items: center; flex-wrap: wrap; gap: 15px;
    }

    .question-number {
        font-family: 'Lalezar', cursive; font-size: 1.5rem; color: var(--primary);
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(236, 72, 153, 0.15));
        padding: 8px 22px; border-radius: 25px;
        border: 2px solid rgba(124, 58, 237, 0.25);
    }

    .question-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .badge-choose {
        background: linear-gradient(135deg, var(--secondary), #f472b6); color: white;
        padding: 8px 28px; border-radius: 25px; font-weight: 900;
        font-size: 1.1rem; box-shadow: 0 5px 15px rgba(236,72,153,0.4);
        animation: pulseBadge 2s ease-in-out infinite;
    }
    @keyframes pulseBadge {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .question-text {
        font-family: 'Lalezar', cursive; font-size: 2.8rem;
        background: linear-gradient(135deg, #4c1d95, #be185d);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        line-height: 1.4; padding: 10px 20px;
        filter: drop-shadow(0 3px 3px rgba(0,0,0,0.1));
    }

    .question-image-preview {
        max-width: 250px; max-height: 250px; margin: 0 auto;
        filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
        animation: floatPreview 3s ease-in-out infinite;
    }
    .question-image-preview svg { width: 100%; height: 100%; }
    @keyframes floatPreview {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .drop-zone {
        width: 100%; max-width: 700px;
        min-height: 250px; border: 6px dashed #94a3b8;
        border-radius: 30px; background: rgba(255,255,255,0.7);
        display: flex; justify-content: center; align-items: center;
        transition: all 0.3s ease; cursor: pointer; position: relative;
        box-shadow: inset 0 4px 15px rgba(0,0,0,0.05);
        margin: 0 auto;
    }
    .drop-zone:hover {
        border-color: var(--primary-light);
        background: rgba(255,255,255,0.85);
    }
    .drop-zone.drag-over {
        border-color: var(--success); background: #ecfdf5;
        transform: scale(1.03);
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.4), inset 0 4px 20px rgba(16,185,129,0.1);
        animation: pulseDrop 0.8s ease infinite;
    }
    @keyframes pulseDrop {
        0%, 100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
        50% { box-shadow: 0 0 60px rgba(16, 185, 129, 0.6); }
    }
    .drop-zone.correct {
        border-color: var(--success); background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        border-style: solid;
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.5), inset 0 0 30px rgba(16,185,129,0.15);
    }
    .drop-zone .placeholder-text {
        color: #64748b; font-weight: 900; font-size: 1.5rem;
        pointer-events: none; text-align: center; padding: 20px;
    }
    .drop-zone .dropped-item {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 15px; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .drop-zone .dropped-item svg { width: 180px; height: 180px; }
    .drop-zone .dropped-item .word-label {
        font-family: 'Lalezar', cursive; font-size: 2.2rem;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .drop-zone .check-mark {
        position: absolute; top: 15px; right: 15px;
        font-size: 3rem; color: var(--success);
        animation: bounceCheck 0.6s ease;
    }
    @keyframes bounceCheck {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

    .options-container {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 25px; padding: 15px;
        width: 100%; max-width: 1100px;
        margin: 0 auto;
    }

    .option-card {
        background: linear-gradient(135deg, #ffffff, #f8fafc);
        border-radius: 25px;
        padding: 20px; min-width: 180px; min-height: 200px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12), inset 0 -3px 0 rgba(0,0,0,0.03);
        border: 4px solid rgba(255,255,255,0.8); cursor: grab;
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        user-select: none; touch-action: none;
        position: relative; overflow: hidden;
    }
    .option-card::before {
        content: ''; position: absolute; top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.6) 50%, transparent 70%);
        transform: rotate(45deg);
        transition: transform 0.6s ease;
        pointer-events: none;
    }
    .option-card:hover::before {
        transform: rotate(45deg) translate(50%, 50%);
    }
    .option-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 20px 40px rgba(0,0,0,0.18);
        border-color: var(--primary-light);
    }
    .option-card:active { cursor: grabbing; }
    .option-card.selected {
        border-color: var(--secondary);
        background: linear-gradient(135deg, #fff0f6, #fce7f3);
        transform: scale(1.05);
        box-shadow: 0 0 0 6px rgba(236, 72, 153, 0.35), 0 15px 35px rgba(236,72,153,0.3);
    }
    .option-card.hint-glow {
        animation: hintGlow 1s ease-in-out 3;
    }
    @keyframes hintGlow {
        0%, 100% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
        50% { border-color: var(--accent); box-shadow: 0 0 30px 8px rgba(245,158,11,0.6); }
    }
    .option-card.dragging { opacity: 0.4; cursor: grabbing; }
    .option-card svg {
        width: 150px; height: 150px;
        pointer-events: none;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
    }
    .option-card .option-word {
        font-family: 'Lalezar', cursive; font-size: 2rem;
        color: var(--text-dark); margin-top: 10px; pointer-events: none;
        text-align: center;
    }

    .dragging-ghost {
        position: fixed; pointer-events: none; z-index: 9999;
        width: 180px; height: 180px; opacity: 0.95;
        transform: translate(-50%, -50%) scale(1.15) rotate(-5deg);
        box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        border-radius: 25px; background: white;
        display: flex; justify-content: center; align-items: center;
        border: 4px solid var(--secondary);
    }
    .dragging-ghost svg { width: 120px; height: 120px; }

    .mascot-wrapper {
        position: fixed; bottom: 25px; right: 25px;
        width: 140px; height: 140px; z-index: 100;
        transition: var(--transition-bounce);
        filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
        cursor: pointer;
    }
    .mascot-svg { width: 100%; height: 100%; animation: floatMascot 3s ease-in-out infinite; }
    .mascot-wrapper.happy { animation: jumpMascot 0.7s ease; }
    .mascot-wrapper.thinking { animation: tiltMascot 0.6s ease; }
    .mascot-wrapper.sleeping { animation: sleepMascot 3s ease-in-out infinite; }
    @keyframes floatMascot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes jumpMascot { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-45px) scale(1.15) rotate(12deg); } }
    @keyframes tiltMascot {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
    }
    @keyframes sleepMascot {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(5px) scale(0.98); }
    }

    .mascot-tooltip {
        position: absolute; top: -50px; right: 0;
        background: white; padding: 8px 15px; border-radius: 15px;
        font-size: 0.9rem; font-weight: 700; color: var(--primary);
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        white-space: nowrap; opacity: 0; pointer-events: none;
        transition: opacity 0.3s;
    }
    .mascot-tooltip::after {
        content: ''; position: absolute; bottom: -8px; right: 20px;
        width: 0; height: 0; border-left: 8px solid transparent;
        border-right: 8px solid transparent; border-top: 8px solid white;
    }
    .mascot-wrapper:hover .mascot-tooltip { opacity: 1; }

    .overlay {
        position: fixed; inset: 0;
        background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px);
        display: flex; justify-content: center; align-items: center;
        z-index: 2000; opacity: 0; pointer-events: none;
        transition: opacity 0.4s ease;
        padding: 20px; overflow-y: auto;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-card {
        background: linear-gradient(135deg, #ffffff, #f0f9ff); 
        padding: 40px 35px; border-radius: 40px;
        text-align: center; max-width: 90%; width: 550px;
        box-shadow: 0 30px 80px -12px rgba(0,0,0,0.35), inset 0 0 0 8px rgba(255,255,255,0.8);
        transform: scale(0.3) translateY(80px);
        transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative; margin: auto;
    }
    .overlay-card::before {
        content: ''; position: absolute; inset: -4px;
        background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
        border-radius: 42px; z-index: -1;
        filter: blur(15px); opacity: 0.5;
    }
    .overlay.show .overlay-card { transform: scale(1) translateY(0); }
    .overlay-icon { font-size: 6rem; margin-bottom: 10px; animation: floatMascot 2s infinite; }

    .stars-display {
        display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;
        font-size: 3rem;
    }
    .star-item {
        color: #cbd5e1; transition: all 0.5s ease;
        animation: starPop 0.5s ease backwards;
    }
    .star-item.earned {
        color: #fbbf24; text-shadow: 0 0 20px #fbbf24;
    }
    .star-item:nth-child(1) { animation-delay: 0.3s; }
    .star-item:nth-child(2) { animation-delay: 0.5s; }
    .star-item:nth-child(3) { animation-delay: 0.7s; }
    @keyframes starPop {
        0% { transform: scale(0) rotate(-180deg); opacity: 0; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .overlay-title { 
        font-family: 'Lalezar', cursive; font-size: 2.5rem; 
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 10px; 
    }
    .overlay-desc { font-size: 1.15rem; color: #475569; margin-bottom: 20px; font-weight: 700; }

    .achievements-container {
        display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
        background: #f8fafc; padding: 15px; border-radius: 20px;
        max-height: 180px; overflow-y: auto;
    }
    .achievement {
        display: flex; align-items: center; gap: 10px;
        background: white; padding: 10px 15px; border-radius: 15px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        animation: achievementIn 0.5s ease backwards;
    }
    .achievement:nth-child(1) { animation-delay: 0.4s; }
    .achievement:nth-child(2) { animation-delay: 0.6s; }
    .achievement:nth-child(3) { animation-delay: 0.8s; }
    .achievement:nth-child(4) { animation-delay: 1.0s; }
    @keyframes achievementIn {
        0% { transform: translateX(50px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
    }
    .achievement-icon { font-size: 1.8rem; }
    .achievement-text { text-align: right; flex: 1; }
    .achievement-text strong { display: block; font-size: 0.95rem; color: var(--primary); }
    .achievement-text span { font-size: 0.8rem; color: #64748b; }

    .final-stats {
        display: flex; justify-content: space-around; margin-bottom: 20px;
        background: #f1f5f9; padding: 15px; border-radius: 20px;
    }
    .final-stat { display: flex; flex-direction: column; align-items: center; }
    .final-stat-value { font-family: 'Lalezar', cursive; font-size: 1.8rem; color: var(--primary); }
    .final-stat-label { font-size: 0.8rem; color: #64748b; font-weight: 700; }

    .overlay-actions { display: flex; flex-direction: column; gap: 12px; }
    .overlay-actions button { width: 100%; justify-content: center; padding: 16px; font-size: 1.2rem; border-radius: 20px; }
    .btn-replay { background: linear-gradient(135deg, var(--success), var(--success-light)); color: white; box-shadow: 0 8px 20px rgba(16,185,129,0.4); }
    .btn-levels { background: linear-gradient(135deg, var(--accent), #fbbf24); color: white; box-shadow: 0 8px 20px rgba(245,158,11,0.4); }

    .particle {
        position: fixed; pointer-events: none; font-size: 2rem;
        z-index: 1500; animation: popOut 1s ease-out forwards;
    }
    @keyframes popOut {
        0% { transform: translate(0, 0) scale(1) rotate(0); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(720deg); opacity: 0; }
    }

    .milestone-banner {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: linear-gradient(135deg, #7c3aed, #ec4899, #f59e0b);
        color: white; padding: 30px 60px; border-radius: 30px;
        font-family: 'Lalezar', cursive; font-size: 2.5rem;
        box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        z-index: 2500; opacity: 0; pointer-events: none;
        text-align: center;
    }
    .milestone-banner.show {
        animation: milestoneIn 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes milestoneIn {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    @media (max-width: 900px) {
        h1 { font-size: 2.5rem; }
        .question-text { font-size: 2rem; }
        .option-card { min-width: 130px; min-height: 150px; padding: 15px; }
        .option-card svg { width: 100px; height: 100px; }
        .option-card .option-word { font-size: 1.5rem; }
        .drop-zone { min-height: 180px; }
        .drop-zone .dropped-item svg { width: 130px; height: 130px; }
        .drop-zone .dropped-item .word-label { font-size: 1.7rem; }
        .question-image-preview { max-width: 180px; max-height: 180px; }
        .milestone-banner { font-size: 1.8rem; padding: 20px 40px; }
    }

    @media (max-width: 600px) {
        h1 { font-size: 2rem; }
        .question-text { font-size: 1.6rem; }
        .question-card { padding: 20px; }
        .option-card { min-width: 100px; min-height: 120px; padding: 12px; }
        .option-card svg { width: 70px; height: 70px; }
        .option-card .option-word { font-size: 1.2rem; }
        .drop-zone { min-height: 150px; border-width: 4px; }
        .drop-zone .dropped-item svg { width: 100px; height: 100px; }
        .drop-zone .dropped-item .word-label { font-size: 1.4rem; }
        .mascot-wrapper { width: 90px; height: 90px; bottom: 10px; right: 10px; }
        .question-image-preview { max-width: 140px; max-height: 140px; }
        .options-container { gap: 12px; }
        .toast { font-size: 1rem; padding: 12px 25px; }
        .btn-hint, .btn-voice { font-size: 0.85rem; padding: 8px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>

   ========================================= */
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol=0.1) {
    if (!soundEnabled) return;
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playClapSound() {
    if (!soundEnabled) return;
    initAudio();
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    filter.Q.value = 1;
    const gainNode = audioCtx.createGain();
    const now = audioCtx.currentTime;
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(1, now + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    gainNode.gain.setValueAtTime(0, now + 0.15);
    gainNode.gain.linearRampToValueAtTime(0.8, now + 0.17);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
    noiseNode.start();
}

function playSound(type) {
    if (!soundEnabled) return;
    if (type === 'success') {
        playClapSound();
        setTimeout(() => playTone(659.25, 'sine', 0.1, 0.05), 100);
        setTimeout(() => playTone(783.99, 'sine', 0.2, 0.05), 200);
    } else if (type === 'error') {
        playTone(250, 'sine', 0.3, 0.05);
    } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.3, 0.05), i * 150));
    } else if (type === 'click') {
        playTone(600, 'sine', 0.05, 0.02);
    } else if (type === 'hover') {
        playTone(800, 'sine', 0.03, 0.015);
    } else if (type === 'streak') {
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            setTimeout(() => playTone(f, 'triangle', 0.2, 0.05), i * 100);
        });
    } else if (type === 'achievement') {
        [880, 1108.73, 1318.51, 1760].forEach((f, i) => {
            setTimeout(() => playTone(f, 'sine', 0.3, 0.06), i * 120);
        });
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

    questionTextEl.innerText = currentQuestion.text;

    if (currentQuestion.type === 'word') {

        questionImagePreview.style.display = 'block';
    } else {

        questionImagePreview.style.display = 'none';
    }

    const level = levels[currentLevelIndex];
    const optionsCount = level.optionsCount;
    let allIds = schoolData.map(d => d.id);
    let wrongIds = allIds.filter(id => id !== currentQuestion.correctId);
    wrongIds = shuffle(wrongIds).slice(0, optionsCount - 1);
    let optionIds = [currentQuestion.correctId, ...wrongIds];
    optionIds = shuffle(optionIds);

    currentOptions = optionIds.map(id => schoolData.find(d => d.id === id));
    renderOptions();

    setMascotMood('normal');
    resetMascotAfterDelay();

        card.addEventListener('mouseenter', () => { if (!isAnswered) playSound('hover'); });
        setupDragAndDrop(card, item.id);
        card.addEventListener('click', (e) => {
            if (e.defaultPrevented) return;

        });
        card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();

        optionsContainer.appendChild(card);

            streakBox.classList.add('pulse');

/* =========================================
   ✅ السحب والإفلات (يعمل على الكمبيوتر والموبايل)
   ========================================= */
function setupDragAndDrop(element, id) {
    // ✅ السحب على الكمبيوتر (Native HTML5 Drag)
    element.setAttribute('draggable', 'true');
    
    element.addEventListener('dragstart', (e) => {
        if (isAnswered) { e.preventDefault(); return; }
        e.dataTransfer.setData('text/plain', String(id));
        e.dataTransfer.effectAllowed = 'move';
        element.classList.add('dragging');
    });
    
    element.addEventListener('dragend', () => {
        element.classList.remove('dragging');
        dropZone.classList.remove('drag-over');
    });
    
    // ✅ السحب على الموبايل/اللمس (Pointer Events)
    element.addEventListener('pointerdown', (e) => {
        if (isAnswered) return;
        if (e.pointerType === 'mouse') return; // الماوس بيستخدم Native drag فوق
        if (e.button !== 0) return;
        
        const startX = e.clientX, startY = e.clientY;
        const pid = e.pointerId;
        let dragging = false;
        let ghost = null;
        
        const onMove = (ev) => {
            if (ev.pointerId !== pid) return;
            
            if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) {
                dragging = true;
                ghost = element.cloneNode(true);
                ghost.classList.add('dragging-ghost');
                ghost.style.left = ev.clientX + 'px';
                ghost.style.top = ev.clientY + 'px';
                document.body.appendChild(ghost);
                element.style.opacity = '0.3';
                if (navigator.vibrate) navigator.vibrate(15);
            }
            
            if (dragging && ghost) {
                ev.preventDefault();
                ghost.style.left = ev.clientX + 'px';
                ghost.style.top = ev.clientY + 'px';
                const r = dropZone.getBoundingClientRect();
                const over = ev.clientX >= r.left && ev.clientX <= r.right &&
                             ev.clientY >= r.top && ev.clientY <= r.bottom;
                dropZone.classList.toggle('drag-over', over);
            }
        };
        
        const onUp = (ev) => {
            if (ev.pointerId !== pid) return;
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            if (ghost) { ghost.remove(); ghost = null; }
            element.style.opacity = '';
            dropZone.classList.remove('drag-over');
            
            if (dragging) {
                const r = dropZone.getBoundingClientRect();
                const dropped = ev.clientX >= r.left && ev.clientX <= r.right &&
                                ev.clientY >= r.top && ev.clientY <= r.bottom;
                if (dropped) checkAnswer(id, element);
            }
            // لو مفيش سحب، الكليك هيتعامل معاه
        };
        
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
    });
}

// النقر على منطقة الإسقاط (للطريقة البديلة بالضغط)
dropZone.addEventListener('click', () => {
    if (isAnswered) return;
    if (selectedOptionId !== null) {
        checkAnswer(selectedOptionId, null);
    } else {
        showToast('اختر إجابة أولاً من الأسفل 👇', 'error');
    }
});

dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        dropZone.click();
    }
});

// ✅ معالجات منطقة الإسقاط (Native HTML5 Drag للكمبيوتر)
dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!isAnswered) {
        e.dataTransfer.dropEffect = 'move';
        dropZone.classList.add('drag-over');
    }
});

dropZone.addEventListener('dragleave', (e) => {
    if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
    }
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (isAnswered) return;
    const id = parseInt(e.dataTransfer.getData('text/plain'));
    if (!isNaN(id)) checkAnswer(id, null);
});

function updateProgress() {
    scoreDisplay.innerText = score;
    streakDisplay.innerText = currentStreak;
    if (currentStreak >= 3) {
        streakDisplay.classList.add('streak-fire');
    } else {
        streakDisplay.classList.remove('streak-fire');
    }
    progressText.innerText = `${currentQuestionIndex + (isAnswered ? 1 : 0)} / ${questions.length}`;
    const percent = questions.length === 0 ? 0 : ((currentQuestionIndex + (isAnswered ? 1 : 0)) / questions.length) * 100;
    progressFill.style.width = `${percent}%`;
}

nextBtn.addEventListener('click', () => {
    if (nextBtn.disabled) return;
    currentQuestionIndex++;
    if (currentQuestionIndex >= questions.length) {
        finishGame();
    } else {
        loadQuestion();
    }
});

function finishGame() {
    playSound('win');
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    const accuracy = questions.length === 0 ? 0 : (score / questions.length) * 100;
    let stars = 1;
    if (accuracy >= 60) stars = 2;
    if (accuracy >= 90) stars = 3;

    document.querySelectorAll('.star-item').forEach((s, i) => {
        s.classList.remove('earned');
        if (i < stars) {
            setTimeout(() => s.classList.add('earned'), 400 + i * 200);
        }
    });

    const accuracyDisplay = Math.round((score / questions.length) * 100);

    overlayTitle.innerText = stars === 3 ? 'أنت البطل الأسطوري!' : stars === 2 ? 'عمل رائع يا بطل!' : 'أحسنت!';
    overlayDesc.innerHTML = `لقد تعرّفت على مرافق مدرستك!<br>عدد الأسئلة المكتملة: <strong>${questions.length}</strong>`;

    finalStats.style.display = 'flex';
    document.getElementById('finalCorrect').innerText = score;
    document.getElementById('finalStreak').innerText = maxStreak;
    document.getElementById('finalAccuracy').innerText = accuracyDisplay + '%';

    const achievements = [];
    if (accuracy >= 90) achievements.push({ icon: '🏆', title: 'متفوق', desc: 'أجبت على 90% من الأسئلة بشكل صحيح' });
    if (maxStreak >= 5) achievements.push({ icon: '🔥', title: 'مشتعل', desc: `5 إجابات متتالية صحيحة` });
    if (maxStreak >= 10) achievements.push({ icon: '👑', title: 'ملك الحروف', desc: `10 إجابات متتالية صحيحة` });
    if (hintsLeft === 3) achievements.push({ icon: '🧠', title: 'عبقري', desc: 'أكملت بدون استخدام أي مساعدة' });
    if (totalWrongAttempts === 0) achievements.push({ icon: '🎯', title: 'دقيق', desc: 'لم ترتكب أي خطأ' });

    if (achievements.length > 0) {
        achievementsContainer.style.display = 'flex';
        achievementsContainer.innerHTML = '';
        achievements.forEach(a => {
            const el = document.createElement('div');
            el.className = 'achievement';
            el.innerHTML = `
                <div class="achievement-icon">${a.icon}</div>
                <div class="achievement-text">
                    <strong>${a.title}</strong>
                    <span>${a.desc}</span>
                </div>
            `;
            achievementsContainer.appendChild(el);
        });
        setTimeout(() => playSound('achievement'), 800);
    } else {
        achievementsContainer.style.display = 'none';
    }

    overlay.classList.add('show');

    try {
        localStorage.setItem('aqdar_best_streak', Math.max(maxStreak, parseInt(localStorage.getItem('aqdar_best_streak') || 0)));
        localStorage.setItem('aqdar_games_played', (parseInt(localStorage.getItem('aqdar_games_played') || 0) + 1).toString());
    } catch(e) {}
}

function restartGame() {
    overlay.classList.remove('show');
    initializeGame();
}

function cycleLevel() {
    currentLevelIndex = (currentLevelIndex + 1) % levels.length;
    overlay.classList.remove('show');
    initializeGame();
}

function createParticles(x, y) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const emojis = ['🌟', '✨', '🎉', '⭐', '💫', '🎊'];
    for (let i = 0; i < 15; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        const dx = (Math.random() - 0.5) * 300;
        const dy = (Math.random() - 0.5) * 300;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--dy', `${dy}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
}

window.onload = () => {
    initializeGame();
};
</script>
